name: Build Rapit Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Cache Minecraft
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/minecraft
          key: ${{ runner.os }}-minecraft-forge-1.8.9

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v2.14.0/gradle/wrapper/gradle-wrapper.jar"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Forge Workspace
        run: ./gradlew setupDecompWorkspace --no-daemon
        timeout-minutes: 40

      - name: Build JAR
        run: ./gradlew build --no-daemon
        timeout-minutes: 15

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RapitClient-JAR
          path: build/libs/RapitClient-1.0.0.jar
